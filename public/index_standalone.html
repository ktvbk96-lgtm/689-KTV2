    // LocalStorage helper with graceful fallback
    const loadState = (key, fallback) => {

    // Google Apps Script Backend Code (Code.gs)
    const GAS_CODE_GS = `/**
 * ==============================================================================
 * 689 KTV - Google Apps Script Web App Backend (Code.gs)
 * ຮອງຮັບທັງ HtmlService.createTemplateFromFile('Index') ແລະ Real-time API
 * ==============================================================================
 */

function doGet(e) {
  // ຖ້າມີ parameter action ໃຫ້ຕອບ JSON API, ຖ້າບໍ່ມີໃຫ້ render ໜ້າเว็บ Index.html
  var action = (e && e.parameter && e.parameter.action) ? e.parameter.action : null;
  
  if (!action) {
    // Render Index.html ໂດຍກົງໃນ Google Apps Script
    return HtmlService.createTemplateFromFile('Index')
      .evaluate()
      .setTitle('689 KTV - ລະບົບຄຸ້ມຄອງຮ້ານ ແລະ POS')
      .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL)
      .addMetaTag('viewport', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no');
  }
  
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  if (action === 'getAll') {
    return ContentService.createTextOutput(JSON.stringify({
      status: 'success',
      data: {
        products: getSheetData(ss, 'Products'),
        rooms: getSheetData(ss, 'Rooms'),
        debts: getSheetData(ss, 'Debts'),
        timestamp: new Date().toISOString()
      }
    })).setMimeType(ContentService.MimeType.JSON);
  }
  
  return ContentService.createTextOutput(JSON.stringify({ status: 'ok', msg: '689 KTV Active' }))
    .setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  try {
    var raw = e.postData.contents;
    var parsed = JSON.parse(raw);
    var action = parsed.action;
    var data = parsed.data || {};
    
    if (action === 'saveRooms' && data.rooms) {
      saveSheetData(ss, 'Rooms', data.rooms);
    } else if (action === 'saveProducts' && data.products) {
      saveSheetData(ss, 'Products', data.products);
    } else if (action === 'saveDebts' && data.debts) {
      saveSheetData(ss, 'Debts', data.debts);
    } else if (action === 'saveBill' && data.bill) {
      appendBillRecord(ss, data.bill);
    }
    
    return ContentService.createTextOutput(JSON.stringify({ status: 'success', timestamp: new Date().toISOString() }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ status: 'error', error: err.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

// ຮອງຮັບການເອີ້ນຜ່ານ google.script.run ໂດຍກົງໃນ Index.html
function handleGasApi(action, dataJson) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var data = {};
  if (dataJson) {
    try { data = JSON.parse(dataJson); } catch(e) {}
  }
  
  if (action === 'getAll') {
    return {
      status: 'success',
      data: {
        products: getSheetData(ss, 'Products'),
        rooms: getSheetData(ss, 'Rooms'),
        debts: getSheetData(ss, 'Debts'),
        timestamp: new Date().toISOString()
      }
    };
  }
  
  if (action === 'saveRooms' && data.rooms) {
    saveSheetData(ss, 'Rooms', data.rooms);
  } else if (action === 'saveProducts' && data.products) {
    saveSheetData(ss, 'Products', data.products);
  } else if (action === 'saveDebts' && data.debts) {
    saveSheetData(ss, 'Debts', data.debts);
  } else if (action === 'saveBill' && data.bill) {
    appendBillRecord(ss, data.bill);
  }
  
  return { status: 'success', timestamp: new Date().toISOString() };
}

function getSheetData(ss, sheetName) {
  var sheet = ss.getSheetByName(sheetName);
  if (!sheet) return [];
  var lastRow = sheet.getLastRow();
  if (lastRow < 2) return [];
  var jsonCell = sheet.getRange(2, 1).getValue();
  try {
    return JSON.parse(jsonCell);
  } catch(e) {
    return [];
  }
}

function saveSheetData(ss, sheetName, dataArray) {
  var sheet = ss.getSheetByName(sheetName);
  if (!sheet) {
    sheet = ss.insertSheet(sheetName);
    sheet.getRange(1, 1).setValue("JSON_PAYLOAD");
    sheet.getRange(1, 2).setValue("LAST_UPDATED");
  }
  sheet.getRange(2, 1).setValue(JSON.stringify(dataArray));
  sheet.getRange(2, 2).setValue(new Date().toISOString());
}

function appendBillRecord(ss, bill) {
  var sheet = ss.getSheetByName('SalesHistory');
  if (!sheet) {
    sheet = ss.insertSheet('SalesHistory');
    sheet.appendRow(['Date', 'BillNumber', 'Room/POS', 'Package', 'Staff', 'RoomCharge', 'ItemsCount', 'TotalKip']);
  }
  sheet.appendRow([
    new Date().toISOString(),
    bill.billNumber || '',
    bill.roomName || 'POS Direct',
    bill.packageName || '-',
    bill.staffName || '',
    bill.roomCharge || 0,
    (bill.items ? bill.items.length : 0),
    bill.total || 0
  ]);
}`;

    // =========================================================================
    // 2. MAIN APPLICATION COMPONENT
    // =========================================================================
    function App() {
      // Navigation
      const [activeTab, setActiveTab] = useState('rooms'); // rooms, pos, stock, debts, reports, settings
      
      // Core Data
      const [products, setProducts] = useState(() => loadState('products', INITIAL_PRODUCTS));
      const [rooms, setRooms] = useState(() => loadState('rooms', INITIAL_ROOMS));
      const [packages, setPackages] = useState(() => loadState('packages', INITIAL_PACKAGES));
      const [staffList, setStaffList] = useState(() => loadState('staff', INITIAL_STAFF));
      const [debts, setDebts] = useState(() => loadState('debts', INITIAL_DEBTS));
      const [currentStaff, setCurrentStaff] = useState(() => loadState('staff', INITIAL_STAFF)[0]);
      
      // Google Sheets Real-time Sync Config
      const [gasUrl, setGasUrl] = useState(() => loadState('gasUrl', DEFAULT_GAS_WEBAPP_URL));
      const [autoSync, setAutoSync] = useState(() => loadState('autoSync', true));
      const [syncStatus, setSyncStatus] = useState('idle'); // idle, syncing, success, error
      const [lastSyncTime, setLastSyncTime] = useState(null);
      const [toastMsg, setToastMsg] = useState('');

      // Receipt Font & Size Settings
      const [receiptFontSize, setReceiptFontSize] = useState(() => loadState('receiptFontSize', 'large')); // small, medium, large, xlarge
      const [receiptPaperWidth, setReceiptPaperWidth] = useState(() => loadState('receiptPaperWidth', '58mm'));
      
      // Active Modals
      const [activeBill, setActiveBill] = useState(null);
      const [openRoomTarget, setOpenRoomTarget] = useState(null);
      const [openRoomType, setOpenRoomType] = useState('package');
      const [openSelectedPkgId, setOpenSelectedPkgId] = useState('pkg-4h');
      const [openBookedHours, setOpenBookedHours] = useState(4);
      
      // Room Ordering Modal States
      const [selectedRoom, setSelectedRoom] = useState(null);
      const [orderModalProduct, setOrderModalProduct] = useState(null);
      const [orderQty, setOrderQty] = useState(1);
      const [orderCustomPrice, setOrderCustomPrice] = useState('');
      const [orderSellerId, setOrderSellerId] = useState('');
      const [orderError, setOrderError] = useState('');

      // POS Cart
      const [cart, setCart] = useState([]);
      const [posCategory, setPosCategory] = useState('all');
      const [showPosDebtModal, setShowPosDebtModal] = useState(false);
      const [posCustomerName, setPosCustomerName] = useState('');
      const [posCustomerPhone, setPosCustomerPhone] = useState('');

      // Modals
      const [showScriptModal, setShowScriptModal] = useState(false);
      const [copiedScript, setCopiedScript] = useState(false);

      // Refs to prevent race conditions during background sync
      const productsRef = useRef(products);
      const roomsRef = useRef(rooms);
      const debtsRef = useRef(debts);
      const isPushingRef = useRef(false);

      useEffect(() => { productsRef.current = products; saveState('products', products); }, [products]);
      useEffect(() => { roomsRef.current = rooms; saveState('rooms', rooms); }, [rooms]);
      useEffect(() => { debtsRef.current = debts; saveState('debts', debts); }, [debts]);
      useEffect(() => { saveState('gasUrl', gasUrl); }, [gasUrl]);
      useEffect(() => { saveState('autoSync', autoSync); }, [autoSync]);
      useEffect(() => { saveState('receiptFontSize', receiptFontSize); }, [receiptFontSize]);
      useEffect(() => { saveState('receiptPaperWidth', receiptPaperWidth); }, [receiptPaperWidth]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3500);
      };

      // -----------------------------------------------------------------------
      // REAL-TIME SYNC FUNCTIONS (DUAL ENGINE: google.script.run OR fetch)
      // -----------------------------------------------------------------------
      const triggerPush = async (action, data) => {
        if (!autoSync) return;
        isPushingRef.current = true;
        setSyncStatus('syncing');

        // Check if running inside Google Apps Script (native google.script.run)
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((res) => {
              setSyncStatus('success');
              setLastSyncTime(new Date());
              setTimeout(() => setSyncStatus('idle'), 2500);
              setTimeout(() => { isPushingRef.current = false; }, 2000);
            })
            .withFailureHandler((err) => {
              setSyncStatus('error');
              setTimeout(() => setSyncStatus('idle'), 3500);
              setTimeout(() => { isPushingRef.current = false; }, 2000);
            })
            .handleGasApi(action, JSON.stringify(data));
          return;
        }

        // External Fallback via Web App URL (fetch)
        if (!gasUrl) {
          isPushingRef.current = false;
          return;
        }

        try {
          const payload = JSON.stringify({ action, data, timestamp: new Date().toISOString() });
          await fetch(gasUrl, {
            method: 'POST',
            redirect: 'follow',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: payload
          });
          setSyncStatus('success');
          setLastSyncTime(new Date());
          setTimeout(() => setSyncStatus('idle'), 2500);
        } catch (err) {
          setSyncStatus('error');
          setTimeout(() => setSyncStatus('idle'), 4000);
        } finally {
          setTimeout(() => { isPushingRef.current = false; }, 3000);
        }
      };

      const fetchLatestFromSheets = async (isSilent = false) => {
        if (isPushingRef.current) return;
        if (!isSilent) setSyncStatus('syncing');

        // Check if running inside Google Apps Script (native google.script.run)
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((json) => {
              if (json && json.status === 'success' && json.data) {
                applySheetData(json.data, isSilent);
              }
              if (!isSilent) setSyncStatus('success');
              setTimeout(() => setSyncStatus('idle'), 2500);
            })
            .withFailureHandler((err) => {
              if (!isSilent) {
                setSyncStatus('error');
                setTimeout(() => setSyncStatus('idle'), 3000);
              }
            })
            .handleGasApi('getAll', null);
          return;
        }

        // External Fallback via Web App URL (fetch)
        if (!gasUrl) return;

        try {
          const url = `${gasUrl}${gasUrl.includes('?') ? '&' : '?'}action=getAll&_t=${Date.now()}`;
          const res = await fetch(url, { headers: { Accept: 'application/json' } });
          const json = await res.json();

          if (json.status === 'success' && json.data) {
            applySheetData(json.data, isSilent);
            setLastSyncTime(new Date());
            if (!isSilent) setSyncStatus('success');
            if (!isSilent) setTimeout(() => setSyncStatus('idle'), 2500);
          }
        } catch (e) {
          if (!isSilent) {
            setSyncStatus('error');
            setTimeout(() => setSyncStatus('idle'), 3000);
          }
        }
      };

      const applySheetData = (data, isSilent) => {
        let updated = false;
        if (data.products && Array.isArray(data.products) && data.products.length > 0) {
          if (JSON.stringify(productsRef.current) !== JSON.stringify(data.products)) {
            setProducts(data.products);
            updated = true;
          }
        }
        if (data.rooms && Array.isArray(data.rooms) && data.rooms.length > 0) {
          if (JSON.stringify(roomsRef.current) !== JSON.stringify(data.rooms)) {
            setRooms(data.rooms);
            updated = true;
          }
        }
        if (data.debts && Array.isArray(data.debts) && data.debts.length > 0) {
          if (JSON.stringify(debtsRef.current) !== JSON.stringify(data.debts)) {
            setDebts(data.debts);
            updated = true;
          }
        }
        setLastSyncTime(new Date());
        if (updated && isSilent) {
          showToast('🔄 ຊິ້ງຂໍ້ມູນລ່າສຸດຈາກ Google Sheets ອັດຕະໂນມັດແລ້ວ');
        }
      };

      // 5-Second Real-Time Auto Polling Loop
      useEffect(() => {
        fetchLatestFromSheets(false);

        const pollTimer = setInterval(() => {
          if (document.visibilityState === 'visible' && autoSync && !isPushingRef.current) {
            fetchLatestFromSheets(true);
          }
        }, 5000);

        const onFocus = () => {
          if (document.visibilityState === 'visible' && autoSync) {
            fetchLatestFromSheets(true);
          }
        };
        window.addEventListener('focus', onFocus);
        document.addEventListener('visibilitychange', onFocus);

        return () => {
          clearInterval(pollTimer);
          window.removeEventListener('focus', onFocus);
          document.removeEventListener('visibilitychange', onFocus);
        };
      }, [gasUrl, autoSync]);

      // Download single-file Index.html
      const handleDownloadIndexHtml = () => {
        try {
          const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
          const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'Index.html';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('📥 ດາວໂຫລດໄຟລ໌ "Index.html" ສຳເລັດແລ້ວ! ນຳໄປວາງໃນ Google Apps Script ໄດ້ເລີຍ');
        } catch (err) {
          alert('Error downloading Index.html: ' + err.message);
        }
      };

      // -----------------------------------------------------------------------
      // ROOM ACTIONS
      // -----------------------------------------------------------------------
      const handleConfirmOpenRoom = () => {
        if (!openRoomTarget) return;

        const openTime = new Date();
        let targetEnd = new Date(openTime.getTime());
        let effectiveHours = 4;
        let pkgName = '';
        let hourlyRate = openRoomTarget.hourlyRate;

        if (openRoomType === 'package') {
          const pkg = packages.find(p => p.id === openSelectedPkgId) || packages[0];
          effectiveHours = pkg.durationHours || 4;
          pkgName = pkg.name;
          hourlyRate = pkg.price;
          targetEnd = new Date(openTime.getTime() + effectiveHours * 60 * 60 * 1000);
        } else {
          effectiveHours = openBookedHours;
          targetEnd = new Date(openTime.getTime() + effectiveHours * 60 * 60 * 1000);
        }

        const updated = rooms.map(r => {
          if (r.id === openRoomTarget.id) {
            return {
              ...r,
              status: 'in_use',
              pricingType: openRoomType,
              packageId: openRoomType === 'package' ? openSelectedPkgId : null,
              packageName: pkgName,
              bookedHours: effectiveHours,
              openedAt: openTime.toISOString(),
              targetEndTime: targetEnd.toISOString(),
              openedByStaffName: currentStaff.name,
              hourlyRate: hourlyRate,
              orders: []
            };
          }
          return r;
        });

        setRooms(updated);
        triggerPush('saveRooms', { rooms: updated });
        setOpenRoomTarget(null);
        showToast(`ເປີດ ${openRoomTarget.name} ${effectiveHours} ຊົ່ວໂມງ (${pkgName || 'ລາຍຊົ່ວໂມງ'}) ສຳເລັດ!`);
      };

      // Add item to room with strict validation: Price > 0 and Seller selection
      const handleConfirmOrderItem = () => {
        if (!selectedRoom || !orderModalProduct) return;

        const numPrice = Number(orderCustomPrice.replace(/[^0-9]/g, ''));
        if (numPrice <= 0) {
          setOrderError('⚠️ ທ່ານຕ້ອງປ້ອນລາຄາສິນຄ້າ (ລາຄາຕ້ອງຫຼາຍກວ່າ 0 ₭)');
          return;
        }

        if (!orderSellerId) {
          setOrderError('⚠️ ທ່ານຕ້ອງເລືອກຊື່ພະນັກງານຂາຍ/ເສີບກ່ອນສັ່ງ');
          return;
        }

        if (orderModalProduct.stock < orderQty) {
          setOrderError(`ສະຕັອກບໍ່ພໍ! ເຫຼືອພຽງ ${orderModalProduct.stock} ${orderModalProduct.unit}`);
          return;
        }

        const seller = staffList.find(s => s.id === orderSellerId);

        // Deduct inventory
        const updatedProducts = products.map(p => {
          if (p.id === orderModalProduct.id) {
            return { ...p, stock: Math.max(0, p.stock - orderQty) };
          }
          return p;
        });
        setProducts(updatedProducts);
        triggerPush('saveProducts', { products: updatedProducts });

        // Add order to room
        const newOrder = {
          id: 'ord-' + Date.now(),
          product: orderModalProduct,
          quantity: orderQty,
          price: numPrice,
          sellerName: seller ? seller.name : currentStaff.name,
          orderedAt: new Date().toISOString()
        };

        const updatedRooms = rooms.map(r => {
          if (r.id === selectedRoom.id) {
            const nextOrders = [...r.orders, newOrder];
            const updatedR = { ...r, orders: nextOrders };
            setSelectedRoom(updatedR);
            return updatedR;
          }
          return r;
        });

        setRooms(updatedRooms);
        triggerPush('saveRooms', { rooms: updatedRooms });
        setOrderModalProduct(null);
        setOrderError('');
        showToast(`ສັ່ງ ${orderModalProduct.name} x${orderQty} ເຂົ້າ ${selectedRoom.name} ແລ້ວ!`);
      };

      // Checkout room & generate receipt
      const handleCheckoutRoom = (room) => {
        const itemsTotal = room.orders.reduce((sum, o) => sum + (o.price * o.quantity), 0);
        const roomCharge = room.hourlyRate || 80000;
        const total = roomCharge + itemsTotal;

        const dateNow = new Date();
        const dateStr = dateNow.toISOString().slice(0, 10).replace(/-/g, '');
        const billNumber = `689-${dateStr}-${Math.floor(100 + Math.random() * 900)}`;

        const bill = {
          billNumber,
          roomName: room.name,
          packageName: room.packageName || `${room.bookedHours || 2} ຊົ່ວໂມງ`,
          bookedHours: room.bookedHours || 2,
          startTime: room.openedAt,
          endTime: dateNow.toISOString(),
          targetEndTime: room.targetEndTime,
          roomCharge,
          items: room.orders,
          total,
          staffName: currentStaff.name
        };

        // Reset room
        const updatedRooms = rooms.map(r => {
          if (r.id === room.id) {
            return {
              ...r,
              status: 'available',
              openedAt: null,
              targetEndTime: null,
              bookedHours: null,
              packageId: null,
              packageName: null,
              orders: []
            };
          }
          return r;
        });

        setRooms(updatedRooms);
        triggerPush('saveRooms', { rooms: updatedRooms });
        triggerPush('saveBill', { bill });

        if (selectedRoom && selectedRoom.id === room.id) {
          setSelectedRoom(null);
        }

        setActiveBill(bill);
      };

      // -----------------------------------------------------------------------
      // POS SALES ACTIONS
      // -----------------------------------------------------------------------
      const addToCart = (prod) => {
        if (prod.stock <= 0) {
          alert('ສິນຄ້ານີ້ໝົດສະຕັອກແລ້ວ!');
          return;
        }
        setCart(prev => {
          const exist = prev.find(item => item.product.id === prod.id);
          if (exist) {
            if (exist.quantity >= prod.stock) {
              alert('ສະຕັອກບໍ່ພຽງພໍ!');
              return prev;
            }
            return prev.map(item => item.product.id === prod.id ? { ...item, quantity: item.quantity + 1 } : item);
          }
          return [...prev, { product: prod, quantity: 1, price: prod.salePrice, sellerId: currentStaff.id }];
        });
      };

      const handleCheckoutPos = (paymentMethod) => {
        if (cart.length === 0) return;

        const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const dateNow = new Date();
        const dateStr = dateNow.toISOString().slice(0, 10).replace(/-/g, '');
        const billNumber = `POS-${dateStr}-${Math.floor(100 + Math.random() * 900)}`;

        // Deduct inventory
        const updatedProducts = products.map(p => {
          const match = cart.find(c => c.product.id === p.id);
          if (match) {
            return { ...p, stock: Math.max(0, p.stock - match.quantity) };
          }
          return p;
        });
        setProducts(updatedProducts);
        triggerPush('saveProducts', { products: updatedProducts });

        const bill = {
          billNumber,
          roomName: 'ຂາຍໜ້າຮ້ານ (POS)',
          packageName: paymentMethod === 'cash' ? 'ຈ່າຍເງິນສົດ' : paymentMethod === 'transfer' ? 'ໂອນ BCEL One' : 'ຕິດໜີ້ (Debt)',
          bookedHours: 0,
          startTime: dateNow.toISOString(),
          endTime: dateNow.toISOString(),
          roomCharge: 0,
          items: cart.map(c => ({
            id: 'pos-' + Math.random(),
            product: c.product,
            quantity: c.quantity,
            price: c.price,
            sellerName: currentStaff.name
          })),
          total: subtotal,
          staffName: currentStaff.name
        };

        // If debt payment, record debt
        if (paymentMethod === 'debt') {
          const newDebt = {
            id: 'debt-' + Date.now(),
            customerName: posCustomerName || 'ລູກຄ້າທົ່ວໄປ',
            customerPhone: posCustomerPhone || '-',
            amount: subtotal,
            paidAmount: 0,
            status: 'pending',
            createdAt: dateNow.toISOString(),
            note: `ບິນ POS ${billNumber}`,
            billNumber: billNumber
          };
          const nextDebts = [newDebt, ...debts];
          setDebts(nextDebts);
          triggerPush('saveDebts', { debts: nextDebts });
          setShowPosDebtModal(false);
          setPosCustomerName('');
          setPosCustomerPhone('');
        }

        triggerPush('saveBill', { bill });
        setCart([]);
        setActiveBill(bill);
        showToast(`ຊຳລະເງິນບິນ ${billNumber} ສຳເລັດແລ້ວ!`);
      };

      // -----------------------------------------------------------------------
      // DEBT ACTIONS
      // -----------------------------------------------------------------------
      const handlePayDebt = (debtId, payAmount) => {
        const nextDebts = debts.map(d => {
          if (d.id === debtId) {
            const newPaid = d.paidAmount + payAmount;
            return {
              ...d,
              paidAmount: newPaid,
              status: newPaid >= d.amount ? 'paid' : 'pending'
            };
          }
          return d;
        });
        setDebts(nextDebts);
        triggerPush('saveDebts', { debts: nextDebts });
        showToast('ບັນທຶກການຊຳລະໜີ້ສຳເລັດແລ້ວ!');
      };

      // Calculations
      const totalInventoryValue = useMemo(() => {
        return products.reduce((sum, p) => sum + (p.stock * p.salePrice), 0);
      }, [products]);

      const totalPendingDebt = useMemo(() => {
        return debts.filter(d => d.status === 'pending').reduce((sum, d) => sum + (d.amount - d.paidAmount), 0);
      }, [debts]);

      const isInsideGas = typeof google !== 'undefined' && google.script && google.script.run;

      return (
        <div className="flex-1 flex flex-col">
          {/* ===================================================================
              TOP NAVIGATION BAR
          =================================================================== */}
          <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 shadow-xl">
            <div className="max-w-7xl mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
              {/* Brand Logo & Name */}
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-rose-500 via-purple-600 to-indigo-600 flex items-center justify-center font-black text-white text-base shadow-lg shadow-rose-950/40">
                  🎤
                </div>
                <div>
                  <h1 className="font-black text-base tracking-tight bg-gradient-to-r from-rose-400 via-pink-400 to-amber-300 bg-clip-text text-transparent">
                    689 KTV & RESTAURANT
                  </h1>
                  <span className="text-[10px] text-slate-400">
                    {isInsideGas ? '🟢 ແລ່ນເທິງ Google Apps Script ໂດຍກົງ' : 'Single-File POS (Apps Script Ready)'}
                  </span>
                </div>
              </div>

              {/* Navigation Tabs */}
              <div className="flex items-center gap-1 bg-slate-950 p-1 rounded-2xl border border-slate-800 text-xs overflow-x-auto">
                <button
                  onClick={() => setActiveTab('rooms')}
                  className={`px-3 py-1.5 rounded-xl font-bold transition-all whitespace-nowrap cursor-pointer ${activeTab === 'rooms' ? 'bg-gradient-to-r from-rose-600 to-pink-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                >
                  🚪 ຫ້ອງ KTV ({rooms.filter(r => r.status === 'in_use').length}/{rooms.length})
                </button>
                <button
                  onClick={() => setActiveTab('pos')}
                  className={`px-3 py-1.5 rounded-xl font-bold transition-all whitespace-nowrap cursor-pointer ${activeTab === 'pos' ? 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                >
                  🛒 ຂາຍໜ້າຮ້ານ (POS)
                </button>
                <button
                  onClick={() => setActiveTab('stock')}
                  className={`px-3 py-1.5 rounded-xl font-bold transition-all whitespace-nowrap cursor-pointer ${activeTab === 'stock' ? 'bg-gradient-to-r from-amber-600 to-orange-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                >
                  📦 ສະຕັອກ ({products.length})
                </button>
                <button
                  onClick={() => setActiveTab('debts')}
                  className={`px-3 py-1.5 rounded-xl font-bold transition-all whitespace-nowrap cursor-pointer ${activeTab === 'debts' ? 'bg-gradient-to-r from-red-600 to-rose-700 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                >
                  💳 ລູກໜີ້ ({debts.filter(d => d.status === 'pending').length})
                </button>
                <button
                  onClick={() => setActiveTab('reports')}
                  className={`px-3 py-1.5 rounded-xl font-bold transition-all whitespace-nowrap cursor-pointer ${activeTab === 'reports' ? 'bg-gradient-to-r from-blue-600 to-cyan-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                >
                  📊 ລາຍງານ
                </button>
                <button
                  onClick={() => setActiveTab('settings')}
                  className={`px-3 py-1.5 rounded-xl font-bold transition-all whitespace-nowrap cursor-pointer ${activeTab === 'settings' ? 'bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}
                >
                  ⚙️ ຕັ້ງຄ່າ & Apps Script
                </button>
              </div>

              {/* Action Buttons: Export Index.html & Staff switcher */}
              <div className="flex items-center gap-2">
                <button
                  onClick={handleDownloadIndexHtml}
                  title="ດາວໂຫລດໄຟລ໌ນີ້ເປັນ Index.html ເພື່ອນຳໄປວາງໃນ Google Apps Script > Index.html"
                  className="px-3 py-1.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-bold shadow-md cursor-pointer flex items-center gap-1.5 transition-all"
                >
                  <span>📥</span>
                  <span>ດາວໂຫລດ Index.html</span>
                </button>

                <select
                  value={currentStaff.id}
                  onChange={(e) => setCurrentStaff(staffList.find(s => s.id === e.target.value) || staffList[0])}
                  className="bg-slate-800 border border-slate-700 text-xs rounded-xl px-2.5 py-1.5 text-slate-200 focus:outline-none"
                >
                  {staffList.map(s => (
                    <option key={s.id} value={s.id}>{s.name} ({s.role})</option>
                  ))}
                </select>
              </div>
            </div>

            {/* Real-Time Sync Status Bar */}
            <div className="bg-slate-950/90 border-t border-slate-800/60 px-4 py-1.5 text-xs flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center gap-2 text-[11px]">
                <span className={`w-2.5 h-2.5 rounded-full ${syncStatus === 'syncing' ? 'bg-amber-400 animate-ping' : syncStatus === 'error' ? 'bg-rose-500' : 'bg-emerald-400'}`} />
                <span className="font-semibold text-slate-300">
                  {syncStatus === 'syncing' ? 'ກຳລັງຊິ້ງຂໍ້ມູນກັບ Google Sheets...' :
                   syncStatus === 'error' ? 'ບໍ່ສາມາດເຊື່ອມຕໍ່ Sheets ໄດ້ (ໃຊ້ຂໍ້ມູນ Offline)' :
                   isInsideGas ? '🟢 Native Apps Script: ເຊື່ອມຕໍ່ Google Sheets ໂດຍກົງ (Zero-Lag)' :
                   `🟢 Real-time: ເຊື່ອມຕໍ່ Google Sheets Web App (Auto-Sync ທຸກ 5 ວິ)`}
                </span>
                {lastSyncTime && (
                  <span className="text-[10px] text-slate-500">
                    • ຊິ້ງຫຼ້າສຸດ: {lastSyncTime.toLocaleTimeString('lo-LA')}
                  </span>
                )}
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => setShowScriptModal(true)}
                  className="px-2.5 py-0.5 rounded-lg bg-slate-900 border border-slate-700 hover:bg-slate-800 text-amber-300 text-[11px] font-semibold cursor-pointer"
                >
                  📜 ໂຄ້ດ Code.gs
                </button>
                <button
                  onClick={() => fetchLatestFromSheets(false)}
                  disabled={syncStatus === 'syncing'}
                  className="px-2.5 py-0.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-semibold transition-colors cursor-pointer"
                >
                  🔄 ດຶງຂໍ້ມູນດຽວນີ້
                </button>
              </div>
            </div>
          </header>

          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-5 right-5 z-50 bg-gradient-to-r from-rose-600 to-amber-600 text-white px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-bold animate-bounce flex items-center gap-2 border border-white/20">
              <span>✨</span>
              <span>{toastMsg}</span>
            </div>
          )}

          {/* ===================================================================
              MAIN VIEW AREA
          =================================================================== */}
          <main className="max-w-7xl mx-auto w-full p-4 flex-1">
            {/* TAB 1: ROOM MANAGEMENT */}
            {activeTab === 'rooms' && (
              <div>
                <div className="flex items-center justify-between mb-4">
                  <div>
                    <h2 className="text-lg font-black text-slate-100">ລາຍການຫ້ອງຄາຣາໂອເກະ VIP</h2>
                    <p className="text-xs text-slate-400">ເລືອກຫ້ອງເພື່ອເປີດຫ້ອງ, ສັ່ງເຄື່ອງດື່ມ/ອາຫານ, ຫຼື ຄິດໄລ່ເງິນ</p>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                  {rooms.map(room => {
                    const isBusy = room.status === 'in_use';
                    const itemsTotal = room.orders.reduce((sum, o) => sum + (o.price * o.quantity), 0);
                    const roomFee = room.hourlyRate || 80000;
                    const grandTotal = roomFee + itemsTotal;

                    return (
                      <div
                        key={room.id}
                        className={`rounded-2xl border p-4 transition-all flex flex-col justify-between ${
                          isBusy
                            ? 'bg-gradient-to-br from-rose-950/40 via-slate-900 to-slate-900 border-rose-600/50 shadow-lg shadow-rose-950/30'
                            : 'bg-slate-900 border-slate-800 hover:border-slate-700'
                        }`}
                      >
                        <div>
                          <div className="flex items-start justify-between gap-2 mb-2">
                            <div>
                              <h3 className="font-black text-base text-slate-100 flex items-center gap-2">
                                <span>{room.name}</span>
                              </h3>
                              <span className="text-[11px] text-slate-400">ຄວາມຈຸ {room.capacity} ຄົນ</span>
                            </div>
                            <span className={`px-2.5 py-0.5 rounded-full text-[11px] font-bold ${
                              isBusy ? 'bg-rose-500/20 text-rose-300 border border-rose-500/30' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                            }`}>
                              {isBusy ? '🔴 ກຳລັງໃຊ້ງານ' : '🟢 ຫ້ອງວ່າງ'}
                            </span>
                          </div>

                          {isBusy ? (
                            <div className="space-y-2 mt-3 p-3 rounded-xl bg-slate-950/70 border border-slate-800 text-xs">
                              <div className="flex justify-between text-slate-300">
                                <span className="text-slate-400">ແພັກເກັດ/ເວລາ:</span>
                                <span className="font-bold text-amber-400">{room.packageName || `${room.bookedHours} ຊົ່ວໂມງ`}</span>
                              </div>
                              <div className="flex justify-between text-slate-300">
                                <span className="text-slate-400">ເປີດເມື່ອ:</span>
                                <span>{room.openedAt ? new Date(room.openedAt).toLocaleTimeString('lo-LA', { hour: '2-digit', minute: '2-digit' }) : '-'}</span>
                              </div>
                              <div className="flex justify-between text-slate-300">
                                <span className="text-slate-400">ກຳນົດສິ້ນສຸດ:</span>
                                <span className="font-bold text-rose-400">
                                  {room.targetEndTime ? new Date(room.targetEndTime).toLocaleTimeString('lo-LA', { hour: '2-digit', minute: '2-digit' }) : '-'}
                                </span>
                              </div>
                              <div className="flex justify-between text-slate-300 pt-1 border-t border-slate-800">
                                <span className="text-slate-400">ລາຍການສັ່ງ ({room.orders.length}):</span>
                                <span className="font-bold">{formatKip(itemsTotal)}</span>
                              </div>
                              <div className="flex justify-between text-sm font-black text-emerald-400 pt-1 border-t border-slate-800">
                                <span>ຍອດລວມ:</span>
                                <span>{formatKip(grandTotal)}</span>
                              </div>
                            </div>
                          ) : (
                            <div className="py-6 text-center text-xs text-slate-500">
                              ຫ້ອງວ່າງ ພ້ອມຕ້ອນຮັບລູກຄ້າ
                            </div>
                          )}
                        </div>

                        <div className="mt-4 pt-3 border-t border-slate-800/80 flex items-center gap-2">
                          {isBusy ? (
                            <>
                              <button
                                onClick={() => setSelectedRoom(room)}
                                className="flex-1 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold transition-colors cursor-pointer"
                              >
                                📝 ສັ່ງເຄື່ອງດື່ມ/ອາຫານ
                              </button>
                              <button
                                onClick={() => handleCheckoutRoom(room)}
                                className="px-3 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold transition-colors cursor-pointer shadow-md shadow-rose-900/40"
                              >
                                💳 ເຊັກບິນ

                    <p className="text-xs text-slate-400">ວາງໂຄ້ດນີ້ໃນ Code.gs ຂອງ Google Sheets Apps Script</p>
                  </div>
                  <button onClick={() => setShowScriptModal(false)} className="text-slate-400 hover:text-white font-bold text-lg cursor-pointer">×</button>
                </div>

                <div className="flex-1 overflow-y-auto">
                  <pre className="p-4 rounded-xl bg-slate-950 border border-slate-800 text-emerald-400 font-mono text-xs overflow-x-auto select-all">
                    {GAS_CODE_GS}
                  </pre>
                </div>

                <div className="pt-2 flex items-center justify-between border-t border-slate-800">
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(GAS_CODE_GS);
                      setCopiedScript(true);
                      setTimeout(() => setCopiedScript(false), 2000);
                    }}
                    className="px-4 py-2 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs shadow-md cursor-pointer flex items-center gap-2"
                  >
                    <span>{copiedScript ? '✓ ຄັດລອກແລ້ວ!' : '📋 ຄັດລອກໂຄ້ດ Code.gs'}</span>
                  </button>
                  <button
                    onClick={() => setShowScriptModal(false)}
                    className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs cursor-pointer"
                  >
                    ປິດໜ້າຕ່າງ
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
